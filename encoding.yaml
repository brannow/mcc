temp_dir: /tmp/encoding  # global default, overridable per preset
probe_concurrency: 8     # max parallel ffprobe processes
media_extensions:       # file types to scan (defaults below)
  - mkv
  - mp4
  - avi
  - m4v
  - webm
  - mov
  - wmv
  - flv
  - ts
  - mpg
  - mpeg
skip_codecs:              # never re-encode files already in these codecs
  - hevc
  - av1

presets:
  anime:
    target_format: mkv
    target_codec: hevc
    # temp_dir: /tmp/anime  # optional per-preset override
    ffmpeg_args:
      - -tune
      - animation
      - -pix_fmt
      - yuv420p10le
      - -crf
      - "24"
      - -preset
      - medium
      - -map
      - "0"
      - -c
      - copy
      - -c:v
      - libx265
      - -x265-params
      - profile=main10

  movies:
    target_format: mkv
    target_codec: hevc
    ffmpeg_args:
      - -crf
      - "20"
      - -preset
      - medium
      - -map
      - "0"
      - -c
      - copy
      - -c:v
      - libx265

  series:
    target_format: mkv
    target_codec: hevc
    ffmpeg_args:
      - -crf
      - "20"
      - -preset
      - medium
      - -map
      - "0"
      - -c
      - copy
      - -c:v
      - libx265

  series_720p:
    target_format: mkv
    target_codec: hevc
    # scale=w=-2:h=min(ih\,720): clamp height to 720, auto-width (aspect ratio preserved, no upscale)
    # works for all aspect ratios — IMAX 1.43:1→960x720, 2.39:1→1728x720, 16:9→1280x720
    # preset slow: 720p has 44% of 1080p pixels so slow costs roughly the same wall-clock as medium@1080p
    ffmpeg_args:
      - -vf
      - 'scale=w=-2:h=min(ih\,720)'
      - -crf
      - "22"
      - -preset
      - slow
      - -map
      - "0"
      - -c
      - copy
      - -c:v
      - libx265
